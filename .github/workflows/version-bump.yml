name: Version Bump on Merge

on:
  push:
    branches: [ main ]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Check if commit is from bot
        id: check_author
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%an')
          echo "Author: $AUTHOR"
          if [[ "$AUTHOR" == "github-actions[bot]" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping - commit from bot"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Read current version
        if: steps.check_author.outputs.skip == 'false'
        id: current_version
        run: |
          VERSION=$(cat VERSION)
          echo "current=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Increment version
        if: steps.check_author.outputs.skip == 'false'
        id: new_version
        run: |
          VERSION=${{ steps.current_version.outputs.current }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "$NEW_VERSION" > VERSION
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
      
      - name: Commit version bump
        if: steps.check_author.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "[skip ci] Bump version to ${{ steps.new_version.outputs.version }}"
          git push
      
      - name: Create Git tag
        if: steps.check_author.outputs.skip == 'false'
        run: |
          git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release version ${{ steps.new_version.outputs.version }}"
          git push origin "v${{ steps.new_version.outputs.version }}"
      
      - name: Trigger Jenkins
        if: steps.check_author.outputs.skip == 'false'
        run: |
          echo "✅ Version bumped to ${{ steps.new_version.outputs.version }}"
          echo "Jenkins will now build and push to Nexus via webhook"
